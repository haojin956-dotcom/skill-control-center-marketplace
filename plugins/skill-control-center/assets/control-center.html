<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #111111;
      --muted: #8b8b88;
      --surface: rgba(255, 255, 255, .76);
      --surface-solid: #ffffff;
      --surface-2: rgba(245, 245, 242, .86);
      --line: rgba(17, 17, 17, .075);
      --accent: #111111;
      --accent-soft: rgba(17, 17, 17, .055);
      --good: #1f9668;
      --warn: #d78a27;
      --bad: #d94e5d;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #ececea; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(8px, 2vw, 20px);
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.95), transparent 32%),
        linear-gradient(180deg, #f2f2f0 0%, #e7e7e4 100%);
    }
    button { font: inherit; }
    .shell {
      --shell-pad: clamp(16px, 2.5vw, 24px);
      position: relative;
      max-width: 680px;
      margin: 0 auto;
      padding: var(--shell-pad);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: clamp(22px, 3vw, 30px);
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(39,39,35,.12), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(30px) saturate(115%);
      -webkit-backdrop-filter: blur(30px) saturate(115%);
    }
    .shell::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      left: 50%;
      top: -96px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255, 216, 130, .2);
      filter: blur(22px);
      pointer-events: none;
    }
    .top { position: relative; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .eyebrow { color: var(--muted); font-weight: 700; font-size: 9px; letter-spacing: .11em; text-transform: uppercase; }
    h1 { max-width: 520px; font-size: clamp(20px, 4vw, 27px); line-height: 1.1; letter-spacing: -.03em; margin: 4px 0 3px; }
    .meta { color: var(--muted); font-size: 10px; line-height: 1.35; }
    .status { border: 0; background: var(--surface-solid); border-radius: 999px; padding: 6px 9px; box-shadow: 0 5px 16px rgba(25,25,22,.07); font-size: 9px; font-weight: 750; white-space: nowrap; text-transform: capitalize; }
    .hero { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: auto auto auto; align-items: center; justify-items: stretch; column-gap: 14px; row-gap: 3px; padding: 14px 0 5px; text-align: left; }
    .progress-orb { grid-row: 1 / 4; width: 72px; height: 72px; padding: 5px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--ink) calc(var(--progress) * 1%), rgba(17,17,17,.07) 0); box-shadow: 0 10px 26px rgba(32,32,28,.1); }
    .progress-orb::before { content: ""; grid-area: 1/1; width: 100%; height: 100%; border-radius: inherit; background: radial-gradient(circle at 38% 28%, #fffdf8, #f1eee6); }
    .progress-value { z-index: 1; grid-area: 1/1; font-size: 17px; font-weight: 760; letter-spacing: -.04em; }
    .progress-caption { margin: 0; color: var(--ink); font-size: 11px; font-weight: 680; }
    .progress { height: 3px; background: rgba(17,17,17,.06); border-radius: 999px; overflow: hidden; margin: 3px 0; max-width: none; width: 100%; }
    .progress > span { display: block; height: 100%; background: var(--ink); border-radius: inherit; transition: width .25s ease; }
    .progress-copy { width: 100%; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 9px; }
    .actions { display: grid; grid-template-columns: 1fr 58px 1fr; align-items: center; gap: 8px; margin: 15px calc(var(--shell-pad) * -1) calc(var(--shell-pad) * -1); padding: 12px var(--shell-pad) 14px; border-top: 1px solid var(--line); background: rgba(248,248,246,.72); }
    .button { min-height: 34px; border: 0; color: var(--muted); background: transparent; border-radius: 999px; padding: 7px 10px; cursor: pointer; transition: transform .18s ease, background .18s ease, color .18s ease; font-size: 11px; }
    .button:hover { color: var(--ink); background: rgba(17,17,17,.05); transform: translateY(-1px); }
    .button.primary { width: 58px; height: 58px; padding: 0; justify-self: center; background: var(--ink); color: white; box-shadow: 0 9px 20px rgba(17,17,17,.18); }
    .button.primary:hover { background: #000; transform: translateY(-2px); }
    .button.danger { color: var(--muted); }
    .button.danger:hover { color: var(--bad); background: rgba(217,78,93,.07); }
    .button:disabled { opacity: .32; cursor: not-allowed; transform: none; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 15px 0 7px; }
    .section-title h2 { font-size: 11px; margin: 0; letter-spacing: -.01em; }
    .step-list { display: grid; gap: 5px; }
    .step { border: 1px solid transparent; border-radius: 14px; padding: 9px 10px; display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: start; background: rgba(255,255,255,.58); transition: border-color .2s, transform .2s, box-shadow .2s; }
    .step.current { border-color: rgba(17,17,17,.12); transform: translateY(-1px); box-shadow: 0 12px 30px rgba(30,30,27,.075); background: rgba(255,255,255,.9); }
    .dot { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: #efefec; color: var(--muted); font-size: 9px; font-weight: 800; }
    .completed .dot { background: var(--ink); color: white; }
    .failed .dot { background: var(--bad); color: white; }
    .running .dot { background: #f3c75f; color: var(--ink); box-shadow: 0 0 0 7px rgba(243,199,95,.16); }
    .skipped { opacity: .55; }
    .step-title { font-weight: 720; font-size: 11px; }
    .step-copy { color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.3; }
    .tag { color: #aaa9a5; font-size: 8px; margin-top: 2px; text-transform: capitalize; }
    .switch { width: 34px; height: 20px; padding: 3px; border: 0; border-radius: 999px; background: #d5d5d1; cursor: pointer; }
    .switch::after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .18s; }
    .switch.on { background: var(--ink); }
    .switch.on::after { transform: translateX(14px); }
    .switch:disabled { opacity: .38; cursor: not-allowed; }
    .skip-button { align-self: center; border: 0; border-radius: 999px; padding: 5px 8px; color: #777772; background: rgba(17,17,17,.055); cursor: pointer; font-size: 9px; font-weight: 700; }
    .skip-button:hover { color: var(--bad); background: rgba(217,78,93,.08); }
    .skip-button.restore { color: white; background: var(--ink); }
    .skip-button:disabled { opacity: .35; cursor: not-allowed; }
    .settings-menu { margin-top: 9px; border: 1px solid rgba(17,17,17,.06); border-radius: 14px; background: rgba(255,255,255,.42); overflow: hidden; }
    .settings-menu summary { min-height: 38px; padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; font-size: 10px; font-weight: 720; user-select: none; }
    .settings-menu summary::-webkit-details-marker { display: none; }
    .settings-menu summary:hover { background: rgba(255,255,255,.5); }
    .settings-menu summary:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
    .settings-menu summary::after { content: "⌄"; color: var(--muted); font-size: 14px; line-height: 1; transition: transform .18s ease; }
    .settings-menu[open] summary::after { transform: rotate(180deg); }
    .settings-summary-copy { display: flex; align-items: baseline; gap: 7px; }
    .settings-body { padding: 0 7px 7px; border-top: 1px solid var(--line); }
    .settings-body .section-title { margin: 9px 2px 7px; }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
    .option { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid transparent; border-radius: 13px; padding: 8px 9px; background: rgba(255,255,255,.55); font-size: 10px; }
    .global-setting { margin: 9px 0 0; border-color: rgba(17,17,17,.06); background: rgba(255,255,255,.72); }
    .empty { padding: 52px 20px; text-align: center; color: var(--muted); border: 1px dashed rgba(17,17,17,.12); border-radius: 24px; }
    .error { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(217,78,93,.08); color: var(--bad); font-size: 12px; display: none; }
    .toast { position: fixed; z-index: 10; left: 50%; bottom: 18px; transform: translate(-50%, 12px); padding: 8px 12px; border-radius: 999px; background: rgba(17,17,17,.92); color: white; box-shadow: 0 10px 30px rgba(0,0,0,.18); font-size: 11px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: rgba(190,45,62,.94); }
    [aria-busy="true"] { cursor: progress; }
    @media (max-width: 560px) {
      body { padding: 6px; }
      .shell { --shell-pad: 14px; padding: 16px var(--shell-pad); border-radius: 22px; }
      .options { grid-template-columns: 1fr; }
      .top { align-items: flex-start; }
      .actions { margin-top: 13px; margin-bottom: -16px; padding-top: 10px; padding-bottom: 12px; grid-template-columns: 1fr 52px 1fr; }
      .button.primary { width: 52px; height: 52px; }
      .section-title .meta { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="empty">正在连接 Skill Control Center…</div></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const app = document.getElementById("app");
    const toast = document.getElementById("toast");
    const pending = new Map();
    let nextId = 1;
    let current = null;
    let busy = false;
    let toastTimer = null;
    let settingsOpen = false;

    function notify(message, tone = "ok") {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast show ${tone === "error" ? "error" : ""}`;
      toastTimer = setTimeout(() => { toast.className = "toast"; }, 1800);
    }

    function actionMessage(name, args) {
      if (name === "set_skill_step_enabled") return args.enabled ? "步骤已恢复" : "步骤已跳过";
      if (name === "set_skill_option") return "运行选项已更新";
      if (name === "set_auto_wrap_skills") return "自动显示设置已更新";
      if (name === "set_skill_run_status") return args.status === "paused" ? "流程已暂停" : "流程已继续";
      if (name === "cancel_skill_run") return "后续流程已取消";
      return "已刷新";
    }

    function rpc(method, params) {
      if (window.openai?.callTool && method === "tools/call") {
        return window.openai.callTool(params.name, params.arguments || {});
      }
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function call(name, args) { return rpc("tools/call", { name, arguments: args }); }
    function label(key) {
      return ({
        allow_shell: "允许 Shell 命令",
        allow_file_edits: "允许文件修改",
        allow_mcp: "允许其他 MCP 工具",
        allow_subagents: "允许子 Agent",
      })[key] || key.replaceAll("_", " ");
    }
    function symbol(status) {
      return ({ completed: "✓", failed: "!", running: "▶", skipped: "–", cancelled: "×", pending: "·" })[status] || "·";
    }
    function escapeText(value) {
      const node = document.createElement("span");
      node.textContent = String(value ?? "");
      return node.innerHTML;
    }

    function render(data) {
      current = data;
      const run = data?.run;
      const autoWrap = data?.settings?.autoWrapSkills !== false;
      const autoWrapHtml = `<div class="option global-setting"><span><strong>自动显示 Skill 进程</strong><br><span class="meta">运行领域 Skill 时自动打开控制面板</span></span><button class="switch ${autoWrap ? "on" : ""}" id="auto-wrap" aria-label="切换自动显示 Skill 进程"></button></div>`;
      if (!run) {
        app.innerHTML = `<div class="top"><div><div class="eyebrow">Skill Control Center</div><h1>控制中心设置</h1></div></div>${autoWrapHtml}<div class="empty"><strong>还没有受控运行</strong><br><br>启用领域 Skill 后将自动创建并显示运行。</div><div class="error" id="error"></div>`;
        app.querySelector("#auto-wrap").onclick = () => act("set_auto_wrap_skills", { enabled: !autoWrap });
        return;
      }
      const progress = data.progress || { percent: 0, complete: 0, total: run.steps.length };
      const isLive = run.status === "running" || run.status === "paused";
      const activeStep = run.steps.find((step) => step.status === "running") || run.steps.find((step) => step.status === "pending");
      const stepHtml = run.steps.map((step, index) => `
        <article class="step ${escapeText(step.status)} ${step.status === "running" ? "current" : ""}">
          <div class="dot">${symbol(step.status)}</div>
          <div>
            <div class="step-title">${index + 1}. ${escapeText(step.title)}</div>
            ${step.description ? `<div class="step-copy">${escapeText(step.description)}</div>` : ""}
            <div class="tag">${escapeText(step.status)}${step.message ? ` · ${escapeText(step.message)}` : ""}</div>
          </div>
          ${["pending", "skipped"].includes(step.status) ? `<button class="skip-button ${step.enabled ? "" : "restore"}" data-step="${escapeText(step.id)}" data-step-action="${step.enabled ? "skip" : "restore"}" aria-label="${step.enabled ? "跳过" : "恢复"}步骤 ${escapeText(step.title)}" ${!isLive ? "disabled" : ""}>${step.enabled ? "跳过" : "恢复"}</button>` : ""}
        </article>`).join("");
      const optionsHtml = Object.entries(run.options || {}).map(([key, enabled]) => `
        <div class="option"><span>${escapeText(label(key))}</span><button class="switch ${enabled ? "on" : ""}" data-option="${escapeText(key)}" aria-label="切换 ${escapeText(label(key))}" ${!isLive ? "disabled" : ""}></button></div>`).join("");
      const optionCount = Object.keys(run.options || {}).length;
      const enabledOptionCount = Object.values(run.options || {}).filter(Boolean).length;

      app.innerHTML = `
        <div class="top">
          <div><div class="eyebrow">Skill Control Center</div><h1>${escapeText(run.title)}</h1><div class="meta">${escapeText(run.skillName)} · ${escapeText(run.id)}</div></div>
          <div class="status">${escapeText(run.status)}</div>
        </div>
        <div class="hero">
          <div class="progress-orb" style="--progress:${progress.percent}"><div class="progress-value">${progress.percent}%</div></div>
          <div class="progress-caption">${activeStep ? escapeText(activeStep.title) : "全部步骤已处理"}</div>
          <div class="progress"><span style="width:${progress.percent}%"></span></div>
          <div class="progress-copy"><span>${progress.complete} / ${progress.total} 个步骤</span><span>实时更新</span></div>
        </div>
        <div class="section-title"><h2>执行步骤</h2><span class="meta">未开始步骤可跳过或恢复</span></div>
        <div class="step-list">${stepHtml}</div>
        <details class="settings-menu" id="settings-menu" ${settingsOpen ? "open" : ""}>
          <summary><span class="settings-summary-copy"><span>更多设置</span><span class="meta">${enabledOptionCount}/${optionCount} 项工具已开启</span></span></summary>
          <div class="settings-body">
            ${autoWrapHtml}
            <div class="section-title"><h2>运行选项</h2><span class="meta">Hooks 会阻止已关闭的工具</span></div>
            <div class="options">${optionsHtml}</div>
          </div>
        </details>
        <div class="error" id="error"></div>
        <div class="actions">
          <button class="button" id="refresh">刷新</button>
          <button class="button primary" id="pause" ${!isLive ? "disabled" : ""}>${run.status === "paused" ? "继续" : "暂停"}</button>
          <button class="button danger" id="cancel" ${!isLive ? "disabled" : ""}>取消</button>
        </div>`;

      app.querySelector("#refresh").onclick = () => refresh();
      app.querySelector("#settings-menu").addEventListener("toggle", (event) => { settingsOpen = event.currentTarget.open; });
      const autoWrapButton = app.querySelector("#auto-wrap");
      autoWrapButton.onclick = () => act("set_auto_wrap_skills", { enabled: !autoWrap }, autoWrapButton);
      const pauseButton = app.querySelector("#pause");
      pauseButton.onclick = () => act("set_skill_run_status", { runId: run.id, status: run.status === "paused" ? "running" : "paused" }, pauseButton);
      const cancelButton = app.querySelector("#cancel");
      cancelButton.onclick = () => { if (window.confirm("取消后续执行？已完成的操作不会撤销。")) act("cancel_skill_run", { runId: run.id, reason: "Cancelled from Skill Control Center UI." }, cancelButton); };
      app.querySelectorAll("[data-step]").forEach((button) => button.onclick = () => act("set_skill_step_enabled", { runId: run.id, stepId: button.dataset.step, enabled: button.dataset.stepAction === "restore" }, button));
      app.querySelectorAll("[data-option]").forEach((button) => button.onclick = () => act("set_skill_option", { runId: run.id, key: button.dataset.option, enabled: !button.classList.contains("on") }, button));
    }

    async function act(name, args, trigger = null, { silent = false } = {}) {
      if (busy) return;
      busy = true;
      app.setAttribute("aria-busy", "true");
      const originalLabel = trigger?.textContent;
      if (trigger) { trigger.disabled = true; trigger.textContent = "处理中…"; }
      try {
        const result = await call(name, args);
        render(result?.structuredContent || result);
        if (!silent) notify(actionMessage(name, args));
      } catch (error) {
        const box = document.getElementById("error");
        if (box) { box.style.display = "block"; box.textContent = error?.message || JSON.stringify(error); }
        if (trigger?.isConnected) { trigger.disabled = false; trigger.textContent = originalLabel; }
        if (!silent) notify("操作失败，请重试", "error");
      } finally {
        busy = false;
        app.removeAttribute("aria-busy");
      }
    }

    async function refresh({ silent = false } = {}) {
      const runId = current?.run?.id;
      if (!runId || busy) return;
      await act("get_skill_run", { runId }, silent ? null : document.getElementById("refresh"), { silent });
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) {
        const item = pending.get(message.id); pending.delete(message.id);
        message.error ? item.reject(message.error) : item.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-result") render(message.params?.structuredContent);
    }, { passive: true });

    if (window.openai?.toolOutput) render(window.openai.toolOutput);
    setInterval(() => { if (current?.run && ["running", "paused"].includes(current.run.status)) refresh({ silent: true }); }, 2500);
  </script>
</body>
</html>
